<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Admin Console</title>
    <style>
        :root {
            --bg-main: #1a1a2e;
            --bg-panel: #16213e;
            --accent: #e94560;
            --accent-hover: #ff5277;
            --text-main: white;
            --bg-btn: #0f3460;
            --text-input: black;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; transition: 0.5s; }
        
        /* Sidebar Layout */
        #sidebar { width: 280px; min-width: 280px; background: var(--bg-panel); border-right: 3px solid var(--accent); display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; overflow-y: auto; transition: 0.5s; z-index: 100; box-shadow: 4px 0 15px rgba(0,0,0,0.3); text-align: left;}
        #sidebar h2 { margin-top: 0; padding-bottom: 15px; border-bottom: 1px solid var(--bg-btn); text-align: center; }
        #leaderboard { display: flex; flex-direction: column; gap: 8px; }
        
        .player-score { background: var(--bg-btn); padding: 10px 15px; border-radius: 5px; font-weight: bold; color: var(--text-main); transition: 0.3s; display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
        .first-place { transform: scale(1.05); background: #ffaa00; color: #1a1a2e; border: 2px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.4); font-size: 18px; margin-bottom: 5px; z-index: 2; }
        
        /* Main Content Area */
        .main-content { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        
        .container { max-width: 500px; width: 100%; padding: 30px; background: var(--bg-panel); border-radius: 10px; border: 2px solid var(--accent); transition: 0.5s; text-align: center; }
        select, button { padding: 15px; margin: 15px 0; width: 90%; font-size: 18px; border-radius: 5px; color: var(--text-input); }
        .launch-btn { background: var(--accent); color: white; font-weight: bold; cursor: pointer; border: none; transition: 0.2s;}
        .launch-btn:hover { background: var(--accent-hover); }
        .reset-btn { background: #ffaa00; color: #1a1a2e; font-weight: bold; cursor: pointer; border: none; margin-top: 30px; transition: 0.2s;}
        .reset-btn:hover { background: #e69900; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2 style="color: var(--accent);">Live Leaderboard</h2>
        <div id="leaderboard"><em style="text-align: center; display: block; color: #888;">Waiting for players...</em></div>
    </div>

    <div class="main-content">
        <div class="container">
            <h1 style="color: var(--accent);">Admin Control Panel</h1>
            
            <select id="themeSelect" onchange="changeTheme()">
                <option value="default">Theme: Dark Mode (Default)</option>
                <option value="hacker">Theme: Hacker (Neon Green)</option>
                <option value="light">Theme: Light Mode (Bright)</option>
            </select>
            
            <hr style="border-color: var(--bg-btn); margin: 20px 0;">

            <select id="categorySelect">
                <option value="Sports">Sports Trivia</option>
                <option value="Animals">Animal Trivia</option>
                <option value="Car">Car Trivia</option>
                <option value="Movie">Movie Trivia</option>
            </select>
            <button class="launch-btn" onclick="startGame()">Launch Game Now</button>

            <hr style="border-color: var(--bg-btn); margin: 30px 0;">

            <button class="reset-btn" onclick="resetGame()">Kick All & Reset Server</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const themes = {
            default: { '--bg-main': '#1a1a2e', '--bg-panel': '#16213e', '--accent': '#e94560', '--accent-hover': '#ff5277', '--text-main': 'white', '--bg-btn': '#0f3460', '--text-input': 'black' },
            hacker: { '--bg-main': '#0a0a0a', '--bg-panel': '#111111', '--accent': '#00ff00', '--accent-hover': '#33ff33', '--text-main': '#00ff00', '--bg-btn': '#003300', '--text-input': '#00ff00' },
            light: { '--bg-main': '#f0f0f0', '--bg-panel': '#ffffff', '--accent': '#0055ff', '--accent-hover': '#3377ff', '--text-main': '#333333', '--bg-btn': '#e0e0e0', '--text-input': 'black' }
        };

        socket.on('setTheme', (themeName) => {
            document.getElementById('themeSelect').value = themeName;
            const theme = themes[themeName];
            if (theme) {
                for (let key in theme) {
                    document.documentElement.style.setProperty(key, theme[key]);
                }
            }
        });

        function changeTheme() {
            const selectedTheme = document.getElementById('themeSelect').value;
            socket.emit('changeTheme', selectedTheme);
        }

        function updateLeaderboard(players) {
            const lb = document.getElementById('leaderboard');
            if (players.length === 0) {
                lb.innerHTML = '<em style="text-align: center; display: block; color: #888;">Waiting for players...</em>';
                return;
            }
            lb.innerHTML = '';
            
            players.forEach((p, index) => {
                let extraClass = '';
                if (index === 0 && p.score > 0) {
                    extraClass = 'first-place';
                }
                
                lb.innerHTML += `
                    <div class="player-score ${extraClass}">
                        <span>${p.emoji} ${p.name}</span>
                        <span>${p.score}</span>
                    </div>`;
            });
        }

        // Listens for drops, additions, and score changes dynamically
        socket.on('updateLobby', (players) => updateLeaderboard(players));
        socket.on('showAnswer', (data) => updateLeaderboard(data.leaderboard));
        
        function startGame() {
            const cat = document.getElementById('categorySelect').value;
            socket.emit('startGame', cat);
        }

        function resetGame() {
            if(confirm("Are you sure you want to end the current game and kick everyone back to the login screen?")) {
                socket.emit('resetServer');
            }
        }
    </script>
</body>
</html>
