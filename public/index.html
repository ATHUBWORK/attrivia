<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Trivia 25</title>
    <style>
        :root {
            --bg-main: #1a1a2e;
            --bg-panel: #16213e;
            --accent: #e94560;
            --accent-hover: #ff5277;
            --text-main: white;
            --bg-btn: #0f3460;
            --text-input: black;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; padding: 0; text-align: center; transition: background 0.5s; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar Layout */
        #sidebar { width: 280px; min-width: 280px; background: var(--bg-panel); border-right: 3px solid var(--accent); display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; overflow-y: auto; transition: 0.5s; z-index: 100; box-shadow: 4px 0 15px rgba(0,0,0,0.3); }
        #sidebar h2 { margin-top: 0; padding-bottom: 15px; border-bottom: 1px solid var(--bg-btn); }
        #leaderboard { display: flex; flex-direction: column; gap: 8px; }
        
        .player-score { background: var(--bg-btn); padding: 10px 15px; border-radius: 5px; font-weight: bold; color: var(--text-main); transition: 0.3s; display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
        .first-place { transform: scale(1.05); background: #ffaa00; color: #1a1a2e; border: 2px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.4); font-size: 18px; margin-bottom: 5px; z-index: 2; }
        
        /* Main Content Area */
        .main-content { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        
        .container { max-width: 600px; width: 100%; padding: 30px; background: var(--bg-panel); border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: 0.5s; }
        
        h1, h2 { color: var(--accent); transition: 0.5s; }
        input, button, select { padding: 10px; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; color: var(--text-input); }
        input { width: 60%; }
        select { width: 25%; cursor: pointer; }
        button { background: var(--accent); color: white; cursor: pointer; font-weight: bold; transition: 0.2s; width: 84%; }
        button:hover { background: var(--accent-hover); }
        button:disabled { background: #555; cursor: not-allowed; color: white; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .option-btn { height: 60px; font-size: 14px; background: var(--bg-btn); color: var(--text-main); width: 100%; transition: 0.2s; }
        .hidden { display: none !important; }
        #timerBar { height: 10px; background: var(--accent); width: 100%; transition: width 0.1s linear; margin-top: 20px; border-radius: 5px; }
        .input-group { display: flex; justify-content: center; gap: 10px; align-items: center; }

        /* Mobile Layout */
        @media (max-width: 768px) {
            body { flex-direction: column; height: auto; overflow-y: auto; }
            .main-content { order: 1; overflow-y: visible; padding: 10px; min-height: 60vh; align-items: flex-start; }
            #sidebar { order: 2; width: 100%; min-width: 100%; border-right: none; border-top: 3px solid var(--accent); overflow-y: visible; height: auto; box-shadow: 0 -4px 15px rgba(0,0,0,0.3); }
            
            .container { padding: 15px; margin: 10px auto; }
            .grid { grid-template-columns: 1fr; gap: 8px; }
            .option-btn { height: auto; min-height: 55px; padding: 10px; font-size: 16px; }
            
            .input-group select { width: 30%; }
            .input-group input { width: 65%; }
            button { width: 100%; }
            
            h1 { font-size: 1.8em; }
            #countdownText { font-size: 4rem !important; margin: 10px 0 !important; }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2 style="color: var(--accent);">Leaderboard</h2>
        <div id="leaderboard"></div>
    </div>

    <div class="main-content">
        <!-- Lobby Screen -->
        <div id="lobby" class="container">
            <h1>Speed Trivia</h1>
            <p>Pick an avatar and enter your name to join (Max 25 players)</p>
            <div id="joinControls">
                <div class="input-group">
                    <select id="playerEmoji">
                        <option value="😎">😎</option>
                        <option value="🦊">🦊</option>
                        <option value="👽">👽</option>
                        <option value="🤖">🤖</option>
                        <option value="🚀">🚀</option>
                        <option value="🦄">🦄</option>
                        <option value="🦖">🦖</option>
                        <option value="🏎️">🏎️</option>
                        <option value="🎬">🎬</option>
                        <option value="💩">💩</option>
                        <option value="🐶">🐶</option>
                        <option value="🐱">🐱</option>
                        <option value="🍕">🍕</option>
                        <option value="🎸">🎸</option>
                        <option value="👑">👑</option>
                    </select>
                    <input type="text" id="playerName" placeholder="Your Name" maxlength="12">
                </div>
                <button id="joinBtn" onclick="joinGame()">Join Lobby</button>
            </div>
            <div id="waitingMsg" class="hidden">
                <h3 style="color: var(--accent);">You are in! Waiting for the host to start the game...</h3>
                <h2 style="color: var(--accent-hover); background: var(--bg-btn); padding: 10px; border-radius: 5px; font-size: 1.1em;">⚠️ DO NOT REFRESH OR CLOSE YOUR BROWSER ⚠️</h2>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="gameArea" class="container hidden">
            <h1 id="countdownText" class="hidden" style="font-size: 6rem; margin: 20px 0; color: var(--text-main);">5</h1>
            <h2 id="questionNumber"></h2>
            <h3 id="questionText">Waiting for question...</h3>
            <div id="timerBar"></div>
            <div class="grid" id="optionsGrid"></div>
            <p id="feedback" style="margin-top: 20px; font-weight: bold; font-size: 1.2em;"></p>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOver" class="container hidden">
            <h1>Game Over!</h1>
            <h2 id="winnerName"></h2>
            <button onclick="location.reload()">Back to Lobby</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const themes = {
            default: { '--bg-main': '#1a1a2e', '--bg-panel': '#16213e', '--accent': '#e94560', '--accent-hover': '#ff5277', '--text-main': 'white', '--bg-btn': '#0f3460', '--text-input': 'black' },
            hacker: { '--bg-main': '#0a0a0a', '--bg-panel': '#111111', '--accent': '#00ff00', '--accent-hover': '#33ff33', '--text-main': '#00ff00', '--bg-btn': '#003300', '--text-input': '#00ff00' },
            light: { '--bg-main': '#f0f0f0', '--bg-panel': '#ffffff', '--accent': '#0055ff', '--accent-hover': '#3377ff', '--text-main': '#333333', '--bg-btn': '#e0e0e0', '--text-input': 'black' }
        };

        socket.on('setTheme', (themeName) => {
            const theme = themes[themeName];
            if (theme) {
                for (let key in theme) {
                    document.documentElement.style.setProperty(key, theme[key]);
                }
            }
        });

        function updateLeaderboard(players) {
            const lb = document.getElementById('leaderboard');
            lb.innerHTML = '';
            
            players.forEach((p, index) => {
                let extraClass = '';
                if (index === 0 && p.score > 0) {
                    extraClass = 'first-place';
                }
                
                lb.innerHTML += `
                    <div class="player-score ${extraClass}">
                        <span>${p.emoji} ${p.name}</span>
                        <span>${p.score}</span>
                    </div>`;
            });
        }

        function joinGame() {
            const nameInput = document.getElementById('playerName');
            const emojiInput = document.getElementById('playerEmoji');
            const btn = document.getElementById('joinBtn');
            const name = nameInput.value;
            const emoji = emojiInput.value;
            
            if (name.trim() !== '') {
                socket.emit('joinGame', { name: name, emoji: emoji });
                btn.disabled = true;
                btn.innerText = 'Joined!';
                nameInput.disabled = true;
                emojiInput.disabled = true;
                document.getElementById('waitingMsg').classList.remove('hidden');
            }
        }

        socket.on('updateLobby', (players, isActive) => { updateLeaderboard(players); });

        socket.on('gameStarted', () => {
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('gameOver').classList.add('hidden');
            document.getElementById('gameArea').classList.remove('hidden');
        });

        socket.on('startCountdown', () => {
            document.getElementById('optionsGrid').classList.add('hidden');
            document.getElementById('timerBar').classList.add('hidden');
            document.getElementById('questionNumber').classList.add('hidden');
            document.getElementById('feedback').innerText = '';
            document.getElementById('questionText').innerText = "Get Ready...";
            
            let cdText = document.getElementById('countdownText');
            cdText.classList.remove('hidden');
            
            let count = 5;
            cdText.innerText = count;
            
            let interval = setInterval(() => {
                count--;
                if(count > 0) {
                    cdText.innerText = count;
                } else {
                    clearInterval(interval);
                }
            }, 1000);
        });

        socket.on('newQuestion', (data) => {
            document.getElementById('countdownText').classList.add('hidden');
            document.getElementById('optionsGrid').classList.remove('hidden');
            document.getElementById('timerBar').classList.remove('hidden');
            document.getElementById('questionNumber').classList.remove('hidden');

            document.getElementById('questionNumber').innerText = `Question ${data.questionNumber} of 10`;
            document.getElementById('questionText').innerText = data.question;
            document.getElementById('feedback').innerText = '';
            
            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            data.options.forEach(opt => {
                grid.innerHTML += `<button class="option-btn" onclick="submitAnswer(this, '${opt.replace(/'/g, "\\'")}')">${opt}</button>`;
            });

            let bar = document.getElementById('timerBar');
            bar.style.width = '100%';
            bar.style.transition = 'none';
            setTimeout(() => {
                bar.style.transition = 'width 10s linear';
                bar.style.width = '0%';
            }, 50);
        });

        function submitAnswer(btn, answer) {
            socket.emit('submitAnswer', answer);
            let buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true);
            btn.style.background = 'var(--accent)'; 
        }

        socket.on('showAnswer', (data) => {
            document.getElementById('feedback').innerText = `Time's up! Correct Answer: ${data.correctAnswer}`;
            updateLeaderboard(data.leaderboard);
        });

        socket.on('gameOver', (players) => {
            document.getElementById('gameArea').classList.add('hidden');
            document.getElementById('gameOver').classList.remove('hidden');
            if (players.length > 0) {
                const winnerElement = document.getElementById('winnerName');
                winnerElement.innerText = `Winner: ${players[0].emoji} ${players[0].name} \nwith ${players[0].score} points!`;
                winnerElement.style.fontSize = '3em';
                winnerElement.style.margin = '30px 0';
            }
        });

        socket.on('kickAll', () => {
            location.reload();
        });

        socket.on('errorMsg', (msg) => alert(msg));
    </script>
</body>
</html>
